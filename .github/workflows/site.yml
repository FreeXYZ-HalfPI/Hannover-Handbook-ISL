# Builds the website from handbook/ (mkdocs.yml) and publishes it on GitHub Pages:
# https://freexyz-halfpi.github.io/Hannover-Handbook-ISL/
# Pull requests are only built (with --strict, so broken internal links fail the check).
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Both handbooks side by side, so the Handbook Searcher covers both.
      - uses: actions/checkout@v4
        with:
          path: Hannover-Handbook-ISL
      - uses: actions/checkout@v4
        with:
          repository: FreeXYZ-HalfPI/Hannover-Handbook-InternationalStudents
          path: Hannover-Handbook-InternationalStudents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Hannover-Handbook-ISL/requirements-site.txt
      - name: Install MkDocs
        working-directory: Hannover-Handbook-ISL
        run: pip install -r requirements-site.txt
      - name: Rebuild the search index from both handbooks
        working-directory: Hannover-Handbook-ISL
        run: python3 tools/build_search.py
      - name: Build the website
        working-directory: Hannover-Handbook-ISL
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: Hannover-Handbook-ISL/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
