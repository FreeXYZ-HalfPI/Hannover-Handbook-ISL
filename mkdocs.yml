# SPDX-License-Identifier: GPL-3.0-or-later
# Copyleft 🄯 2026 ISL and contributors
# Website for the handbook: https://freexyz-halfpi.github.io/Hannover-Handbook-ISL/
# Build locally:  pip install -r requirements-site.txt && mkdocs serve
# The pages in handbook/ stay plain GitHub Markdown; tools/mkdocs_hooks.py adapts
# them for the site (GitHub alerts, links outside handbook/, section titles).

site_name: کتابچه راهنمای زندگی و تحصیل در هانوفر
site_description: راهنمای عملی و قدم‌به‌قدم برای دانشجویان دانشگاه لایبنیتس هانوفر — انجمن دانشجویان ایرانی (ISL)
site_author: انجمن دانشجویان ایرانی دانشگاه لایبنیتس هانوفر (ISL)
site_url: https://freexyz-halfpi.github.io/Hannover-Handbook-ISL/
repo_url: https://github.com/FreeXYZ-HalfPI/Hannover-Handbook-ISL
repo_name: Hannover-Handbook-ISL
edit_uri: edit/main/handbook/
copyright: کپی‌لفت 🄯 ۲۰۲۶ ISL و مشارکت‌کنندگان — GNU GPL نسخه ۳ یا بالاتر

docs_dir: handbook
site_dir: site

theme:
  name: material
  language: fa
  direction: rtl
  font:
    text: Vazirmatn
    code: Roboto Mono
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: حالت تیره
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: حالت روشن
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.action.edit

hooks:
  - tools/mkdocs_hooks.py

extra_css:
  - assets/site.css

extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/hannover_iranian_students
      name: کانال تلگرام ISL
    - icon: fontawesome/brands/github
      link: https://github.com/FreeXYZ-HalfPI/Hannover-Handbook-ISL
      name: مخزن GitHub

plugins:
  - search:
      # Split on spaces, hyphens and the zero-width non-joiner used in Persian words.
      separator: '[\s\-‌]+'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  links:
    absolute_links: info
    unrecognized_links: warn
